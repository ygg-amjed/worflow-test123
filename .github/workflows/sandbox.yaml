name: Deploy sandbox

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch
        run: |
          echo "Running from: ${GITHUB_REF}"

          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "ERROR: This workflow can only be executed from the main branch."
            exit 1
          fi

      - name: Verify workflow file exists on main
        run: |
          git fetch origin main --depth=1

          if ! git cat-file -e origin/main:.github/workflows/sandbox.yaml 2>/dev/null; then
            echo "ERROR: .github/workflows/sandbox.yaml must exist on origin/main."
            exit 1
          fi

  deploy:
    needs: validate

    runs-on: ubuntu-latest

    environment:
      name: Configure QA

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy
        run: |
          echo "Deploying to QA from main branch..."
